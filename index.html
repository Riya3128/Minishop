<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MiniShop - A responsive product filtering demo.">
    <title>MiniShop | Find Your Favorites</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="navbar">
        <a class="logo" href="#">mini<span>shop.</span></a>

        <div class="cart">
            <span aria-hidden="true">🛍️</span>
            Bag <span id="cart-count">0</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">THE EVERYDAY COLLECTION</p>
            <h1>Find your next <span>favorite.</span></h1>
            <p class="hero-text">
                Thoughtfully picked essentials, all in one place.
            </p>
        </section>

        <section class="shop-section">
            <div class="section-heading">
                <div>
                    <h2>Explore our collection</h2>
                    <p id="result-count" aria-live="polite">Loading products...</p>
                </div>
            </div>

            <div class="filters">
                <label class="search-box">
                    <span aria-hidden="true">⌕</span>
                    <input type="search" id="search-input" placeholder="Search products..."
                        aria-label="Search products">
                </label>

                <label>
                    <span class="sr-only">Filter by category</span>
                    <select id="category-filter">
                        <option value="all">All categories</option>
                        <option value="Skincare">Skincare</option>
                        <option value="Makeup">Makeup</option>
                        <option value="Haircare">Haircare</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </label>

                <label>
                    <span class="sr-only">Sort by price</span>
                    <select id="sort-filter">
                        <option value="default">Sort by: Featured</option>
                        <option value="low-high">Price: Low to high</option>
                        <option value="high-low">Price: High to low</option>
                    </select>
                </label>

                <button id="reset-button" class="reset-button" type="button">
                    Reset
                </button>
            </div>

            <div id="product-grid" class="product-grid"></div>

            <div id="empty-message" class="empty-message" hidden>
                <h3>No products found</h3>
                <p>Try another search or category.</p>
                <button id="empty-reset" type="button">Show all products</button>
            </div>
        </section>
    </main>

    <footer>
        <a class="logo" href="#">mini<span>shop.</span></a>
        <p>Designed and built as a frontend portfolio project.</p>
    </footer>

</body>

</html>
